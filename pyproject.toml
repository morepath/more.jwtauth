[build-system]
requires = ["setuptools >= 69"]
build-backend = "setuptools.build_meta"

[project]
name="more.jwtauth"
version = "1.0.0.dev0"
dynamic = ["readme"]
description="JWT Access Auth Identity Policy for Morepath"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Henri Hulski", email = "henri@sancode.it"}]
maintainers = [{name = "Henri Hulski", email = "henri@sancode.it"}]
keywords=["morepath", "JWT", "identity", "authentication"]
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "Typing :: Typed",
]
requires-python = ">= 3.11"
dependencies = [
    "morepath >= 1.0.0",
    "PyJWT >= 2.15.1, < 2.16",
]

[project.urls]
Documentation = "https://github.com/morepath/more.jwtauth/blob/master/README.rst"
Repository = "https://github.com/morepath/more.jwtauth"
Issues = "https://github.com/morepath/more.jwtauth/issues"
Changelog = "https://github.com/morepath/more.jwtauth/blob/master/CHANGES.rst"

[project.optional-dependencies]
crypto=["cryptography >= 50.0.2"]
test = ["pytest >= 9", "WebTest >= 3.0.1", "pytest-env"]
coverage = ["pytest-cov"]
lint = ["ruff"]
mypy = ["mypy", "pytest", "types-WebTest >= 3", "cryptography >= 50.0.2"]
pyright = ["pyright", "pytest", "WebTest >= 3.0.1", "types-WebTest >= 3", "cryptography >= 50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

[tool.pytest]
minversion = "9.0"
addopts = [
    "-vv",
    "--import-mode=importlib",
]
consider_namespace_packages = true
testpaths = ["src"]
env = ["RUN_ENV=test"]
filterwarnings = [
    "ignore:'cgi' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/more/jwtauth/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TC", "UP", "RUF"]
ignore = ["E501"]
future-annotations = true

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
known-first-party = ["morepath"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]

[tool.tox]
requires = ["tox>=4.45"]
env_list = [
  { product = [
    [
        "py311",
        "py312",
        "py313",
        "py314",
        "py315"
    ],
    ["crypto", "nocrypto"],
  ] },
  # PyPy runs without the crypto extra only: cryptography 50.0.2 has no working
  # PyPy 3.12 (PyPy 8.0) build, see pyca/cryptography #15801 and #15852.
  # Re-enable pypy3-crypto once fixed upstream.
  "pypy3-nocrypto",
  "coverage",
  "lint",
  "mypy",
  "pyright",
]
skip_missing_interpreters = true

[tool.tox.env_run_base]
package = "editable"
extras = ["test"]
deps = [
    { replace = "if", condition = "factor.crypto", then = ["cryptography"], extend = true },
]
commands = [["pytest", "."]]

[tool.tox.env.coverage]
base_python = ["python3.14"]
extras = ["test", "coverage"]
deps = ["cryptography"]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "."],
]

[tool.tox.env.lint]
base_python = ["python3.14"]
extras = ["lint"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.mypy]
base_python = ["python3.14"]
extras = ["mypy"]
commands = [
    ["mypy", "--python-version", "3.11"],
    ["mypy", "--python-version", "3.12"],
    ["mypy", "--python-version", "3.13"],
    ["mypy", "--python-version", "3.14"],
    ["mypy", "--python-version", "3.15"],
]

[tool.tox.env.pyright]
base_python = ["python3.14"]
extras = ["pyright"]
commands = [
    ["pyright", "--pythonversion", "3.11"],
    ["pyright", "--pythonversion", "3.12"],
    ["pyright", "--pythonversion", "3.13"],
    ["pyright", "--pythonversion", "3.14"],
    ["pyright", "--pythonversion", "3.15"],
]

[tool.zest-releaser]
release = false
upload-pypi = false
tag-format = "v{version}"
